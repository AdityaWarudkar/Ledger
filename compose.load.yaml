name: ledger-load
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_load
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      DB_USERNAME: ledger
      DB_PASSWORD: ledger_load
      SPRING_PROFILES_ACTIVE: local
      WEBHOOK_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
  k6:
    image: grafana/k6:1.6.1
    profiles: ["tools"]
    environment:
      BASE_URL: http://backend:8080
    volumes:
      - ./load:/scripts:ro
      - ./load/results:/results
    command: run /scripts/transfers.js
    depends_on:
      backend:
        condition: service_healthy
