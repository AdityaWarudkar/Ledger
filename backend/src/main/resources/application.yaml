spring:
  application:
    name: ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        ledger.transfer.requests: true
        http.server.requests: true
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /docs
    disable-swagger-default-url: true
server:
  shutdown: graceful
ledger:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:}
  webhooks:
    worker-enabled: ${WEBHOOK_WORKER_ENABLED:true}
    allowed-hosts: ${WEBHOOK_ALLOWED_HOSTS:}
    allow-http: false
    request-timeout: 2s
    lease-duration: 30s
    base-backoff: 2s
    max-backoff: 5m
    max-attempts: 5
    poll-delay-ms: 1000
