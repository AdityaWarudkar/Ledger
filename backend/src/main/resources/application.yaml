spring:
  application:
    name: ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  shutdown: graceful
